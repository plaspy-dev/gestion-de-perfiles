services:
  mysql:
    image: mysql@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    container_name: prueba-gestion-de-perfiles-mysql
    ports: ["127.0.0.1:33359:3306"]
    environment:
      MYSQL_DATABASE: perfiles_demo
      MYSQL_ROOT_PASSWORD: DEMO_LOCAL_ROOT
    command: ["--sql-mode="]
    volumes:
      - ./perfiles.sql:/docker-entrypoint-initdb.d/perfiles.sql:ro
      - ./cuentas.sql:/docker-entrypoint-initdb.d/zz-cuentas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 2s
      retries: 30
